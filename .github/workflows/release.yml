name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test
        run: ./gradlew check

      - name: Write Signing Key
        env:
          OSSRH_GPG_SECRET_FILE_BASE64: ${{ secrets.OSSRH_GPG_SECRET_FILE_BASE64 }}
        run: printf '%s' "$OSSRH_GPG_SECRET_FILE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/secring.gpg"

      - name: Publish to Maven Central
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          OSSRH_GPG_SECRET_KEY_ID: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          OSSRH_GPG_SECRET_KEY_PASSWORD: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          ./gradlew publishAndReleaseToMavenCentral \
            "-PmavenCentralUsername=$OSSRH_USERNAME" \
            "-PmavenCentralPassword=$OSSRH_PASSWORD" \
            "-Psigning.keyId=$OSSRH_GPG_SECRET_KEY_ID" \
            "-Psigning.password=$OSSRH_GPG_SECRET_KEY_PASSWORD" \
            "-Psigning.secretKeyRingFile=$GITHUB_WORKSPACE/secring.gpg"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: ./CHANGELOG.md
