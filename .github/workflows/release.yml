name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test
        run: ./gradlew check

      - name: Write Signing Key
        env:
          OSSRH_GPG_SECRET_FILE_BASE64: ${{ secrets.OSSRH_GPG_SECRET_FILE_BASE64 }}
        run: printf '%s' "$OSSRH_GPG_SECRET_FILE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/secring.gpg"

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.keyId: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.secretKeyRingFile: ${{ github.workspace }}/secring.gpg
        run: ./gradlew publishAndReleaseToMavenCentral

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: ./CHANGELOG.md
